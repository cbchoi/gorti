# Suite-local pytest config. Lives inside ivct-subset so that
# `pytest tests/conformance/rti/ivct-subset` (from anywhere) picks it up
# as the rootdir ini without touching other suites' collection rules.
#
# python_files is required: the module naming convention here is
# tc_<theme>.py (IVCT-style), which the pytest default (test_*.py)
# would silently skip.
[pytest]
python_files = tc_*.py
markers =
    conformance: RTI conformance test (spec-anchored, runs against a live rtid)
    ivct_subset: IVCT-inspired Python-native conformance subset (NOT IVCT itself)
