# mom_federation_lifecycle launch protocol (README + M36 DD re-verdict):
# observer joins+subscribes first and pumps throughout; alice joins,
# dwells 300 ms, resigns; bob launches only after alice's RESIGN so the
# observer sees alice REMOVE before bob DISCOVER (golden step order).
# role     binary-suffix      order  wait-for     args
observer   federate_observer  1      "SUBSCRIBE"  ""
alice      federate_member    2      "RESIGN"     "--name alice --dwell-ms 300"
bob        federate_member    3      ""           "--name bob --dwell-ms 300"
