# fm_sync_subset_with_failure launch protocol: alice (registrar) joins,
# then sleeps 700 ms to let bob and carol join before building the
# {bob,carol} FederateHandleSet — gate each launch on the previous JOIN
# so both peers land inside that window.
# This fixture hardcodes crcAddress=127.0.0.1:8989.
port 8989
# role      binary-suffix       order  wait-for  args
registrar   federate_registrar  1      "JOIN"    ""
bob         federate_bob        2      "JOIN"    ""
carol       federate_carol      3      ""        ""
