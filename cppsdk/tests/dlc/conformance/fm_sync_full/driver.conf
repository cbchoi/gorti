# fm_sync_full launch protocol: registrar joins first, then sleeps 700 ms
# for the peers to join before registering the 1-arg sync point — so bob
# and carol are gated on JOIN markers (fast), never on wall-clock staggers.
# The peer binary takes its federate name from $FED_NAME.
# This fixture hardcodes gortiAddress=127.0.0.1:8080.
port 8080
# role      binary-suffix       order  wait-for    args  env
registrar   federate_registrar  1      "REG: JOIN" ""
bob         federate_peer       2      "JOIN"      ""    "FED_NAME=BOB"
carol       federate_peer       3      ""          ""    "FED_NAME=CAROL"
