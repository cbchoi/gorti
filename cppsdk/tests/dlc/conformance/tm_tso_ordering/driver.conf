# tm_tso_ordering launch protocol (README "Test driver coordination"):
# subscriber first (owns create + must be constrained before the T=1.0
# sends); publishers in canonical name order alice -> bob -> carol, each
# gated on the previous JOIN to pin FederateHandle assignment and thus
# the §8.15 TSO tie-break sort.
# role       binary-suffix        order  wait-for                 args
subscriber   federate_subscriber  1      "JOIN federate=sub"      ""
alice        federate_publisher   2      "JOIN federate=alice"    "--name alice"
bob          federate_publisher   3      "JOIN federate=bob"      "--name bob"
carol        federate_publisher   4      ""                       "--name carol"
