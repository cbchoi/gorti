# om_helloworld_pubsub launch protocol: subscriber first — it must have
# subscribed (SUB: SUBSCRIBE line) before the publisher's REGISTER for
# the §6.9 DISCOVER to fire (the publisher only dwells 500 ms between
# JOIN and REGISTER).
# This fixture hardcodes gortiAddress=127.0.0.1:8080.
port 8080
# role      binary-suffix        order  wait-for      args
subscriber  federate_subscriber  1      "SUBSCRIBE"   ""
publisher   federate_publisher   2      ""            ""
