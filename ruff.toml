line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "C4", "I", "N", "UP", "S", "RET", "SIM", "PIE", "ASYNC"]
ignore = []

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S311"]
"**/_generated/**" = ["E", "F", "W", "B", "C4", "I", "N", "UP", "S", "RET", "SIM", "PIE", "ASYNC"]
