repos:
  - repo: local
    hooks:
      - id: frozen-paths
        name: reject writes to frozen paths from agent branches
        entry: scripts/check-frozen-paths.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: no-emojis
        name: no emojis in source
        entry: scripts/check-no-emojis.sh
        language: script
        files: '\.(go|py|md|proto|yaml|yml|toml)$'

      - id: no-debug-prints
        name: no fmt.Println / print() in committed code
        entry: scripts/check-no-debug-prints.sh
        language: script
        files: '\.(go|py)$'
