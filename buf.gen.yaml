version: v2
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: rti/internal/genproto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: rti/internal/genproto
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/python
    out: pysdk/rti1516e/_generated
  - remote: buf.build/grpc/python
    out: pysdk/rti1516e/_generated
  # C++ stubs are generated below cppsdk/_generated/ and remain untracked.
  - remote: buf.build/protocolbuffers/cpp
    out: cppsdk/_generated
  - remote: buf.build/grpc/cpp
    out: cppsdk/_generated
