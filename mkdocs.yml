site_name: gorti
site_description: Open-source IEEE 1516-2010 (HLA Evolved) RTI in Go
site_url: https://cbchoi.github.io/gorti/
repo_url: https://github.com/cbchoi/gorti
repo_name: cbchoi/gorti
edit_uri: edit/main/docs/

# Keep internal agent/task history in Git without publishing it into the user
# documentation search index.
exclude_docs: |
  tasks/
  reports/
  agent-*.md
  *_DISPATCH_PLAN.md
  AGENTS.md
  DISPATCH.md
  MILESTONE_CHECK.md
  ORTHOGONALITY.md
  templates/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - include-markdown

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - User Guide:
      - Runtime and SDKs: user-guide.md
      - Time Management: time-management.md
      - Operations: operations.md
      - Deployment Matrix: DEPLOYMENT.md
  - Verification:
      - Interoperability: verification.md
      - Reproducibility: reproducibility.md
      - Performance: performance.md
      - Pitch Parity: PITCH_PARITY.md
      - RTI Conformance Audit: RTI_CONFORMANCE_AUDIT.md
      - DLC Compliance Program: DLC_COMPLIANCE_PROGRAM.md
      - DLC Spec Coverage: dlc-spec-coverage.md
      - Known DLC Divergences: DLC_DIVERGENCE_CATALOGUE.md
      - Pitch Golden Licensing: PITCH_GOLDEN_LICENSING.md
  - Research:
      - SoftwareX Submission: softwarex.md
      - Citation: citation.md
      - Roadmap: roadmap.md
  - Architecture & Development:
      - Software Requirements (SRS): srs.md
      - Software Design (SDD): sdd.md
      - Interface Design (IDD): idd.md
      - Design (Phase 0): research-platform.md
      - How-to add an alternative: research-platform-howto.md
      - rtid TUI: rtid-tui.md
      - DDS Adapter: m19-dds-adapter.md
      - M17 to DLC Migration: MIGRATION_M17_TO_DLC.md
      - Contributor Workflow: WORKFLOW.md
      - Coding Conventions: CODING_CONVENTIONS.md
      - Test-Driven Discipline: TDD.md
  - Publishing: readthedocs.md
  - v0.9 Release Candidate: releases/v0.9.0.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cbchoi/gorti

copyright: Copyright &copy; 2026 Changbeom Choi
