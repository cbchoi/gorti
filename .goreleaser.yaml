# GoReleaser config for gorti binary releases.
#
# Two binaries — rtid (RTI server) and rti-top (TUI) — built CGo-free
# for linux/{amd64,arm64}, darwin/{amd64,arm64}, and windows/{amd64,arm64}.
# The default rtid binary has been CGo-free since cut-2 (see
# CHANGELOG-MASTERPLAN.md §M19), so cross-compilation is mechanical.
# Windows targets are a v0.9.0 deployment addition (rtid.exe + rti-top.exe);
# the C++ federate SDK on Windows is a documented future plan — see
# docs/DEPLOYMENT.md. Both binaries verify-cross-build for windows/amd64 and
# windows/arm64; the only Unix-ism is syscall.SIGTERM (compiles on Windows,
# never delivered — Ctrl+C via os.Interrupt drives graceful shutdown).
#
# The DDS-capable rtid-dds variant is intentionally NOT shipped here:
# Phase 1b onwards requires libcyclonedds at link time (CGo), which
# breaks the "no Go env, no system deps" promise of this release path.
# When M19 ships end-to-end, add a separate matrix that runs on hosts
# with Cyclone DDS preinstalled.
#
# Trigger: push a tag matching v* (see .github/workflows/release.yml).
# Local dry run: goreleaser release --snapshot --clean --skip=publish

version: 2

project_name: gorti

before:
  hooks:
    - go mod tidy

builds:
  - id: rtid
    binary: rtid
    main: ./rti/cmd/rtid
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/cbchoi/gorti/rti/internal/buildinfo.Version={{.Version}}
      - -X github.com/cbchoi/gorti/rti/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/cbchoi/gorti/rti/internal/buildinfo.Date={{.Date}}

  - id: rti-top
    binary: rti-top
    main: ./rti/cmd/rti-top
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/cbchoi/gorti/rti/internal/buildinfo.Version={{.Version}}
      - -X github.com/cbchoi/gorti/rti/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/cbchoi/gorti/rti/internal/buildinfo.Date={{.Date}}

archives:
  - id: gorti
    ids: [rtid, rti-top]
    formats: [tar.gz]
    # Windows users expect .zip, not .tar.gz.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      gorti_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG-MASTERPLAN.md

checksum:
  name_template: "gorti_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "0.0.0-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: cbchoi
    name: gorti
  draft: false
  prerelease: auto
  name_template: "gorti {{ .Version }}"
  header: |
    ## gorti {{ .Version }}

    IEEE 1516-2010 (HLA Evolved) Run-Time Infrastructure in Go.

    See [`CHANGELOG-MASTERPLAN.md`](https://github.com/cbchoi/gorti/blob/main/CHANGELOG-MASTERPLAN.md)
    for the full milestone-by-milestone history.
  footer: |
    ---

    Verify the download:

    ```bash
    sha256sum -c gorti_{{ .Version }}_SHA256SUMS
    ```
