[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rti1516e"
version = "0.1.0"
description = "Python SDK for the gorti RTI (IEEE 1516-2010 / HLA Evolved) and pyjevsim bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "gorti contributors" }]

# Runtime dependencies. Keep tight — every dep is friction for users.
# - grpcio + protobuf: client transport + wire format (FROZEN — required to talk to rtid)
# - grpcio-tools is a build-time dep for `_proto.py`; pinned in the dev extra below
# - pyjevsim: bridge target. Version is set by TASK-072 (Agent C); leaving unpinned
#   here so the orchestrator pre-work doesn't pre-empt that task's decision.
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60",         # codegen for _generated/
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-protobuf>=4.24",
]
# pyjevsim extra is wired by TASK-072. Spec tests under pysdk/tests/spec/m4/
# avoid importing real pyjevsim — they consume the typing.Protocol shim in
# pysdk/pyjevsim_bridge/_protocol.py via the StubCoupledModel fake.
pyjevsim = [
    # Pinned to 2.0.1 (latest on PyPI as of 2026-05). Published versions:
    # 1.0.0, 1.3.0, 1.3.1, 2.0.0, 2.0.1. Upstream:
    # https://github.com/cbchoi/pyjevsim
    #
    # 2.0.1 is API-compatible with 1.3.1 at every surface the bridge
    # touches — top-level exports (`StructuralModel`, `BehaviorModel`,
    # `SysExecutor`, `SysMessage`, `ExecutionType`, `Infinite`) and the
    # method names the adapter calls (`output`, `int_trans`, `ext_trans`,
    # `register_entity`, `coupling_relation`, `insert_external_event`,
    # `insert_input_port`, `step`, `get_next_event_time`,
    # `get_global_time`) are unchanged. The release adds Parallel-DEVS
    # confluent transitions (`con_trans`), a heapset-backed scheduler
    # (`ScheduleQueue`), and a documented HLA_TIME execution mode — all
    # additive. The bridge needed no code changes for the upgrade; see
    # the 2026-05-03 entry in CHANGELOG-MASTERPLAN.md for the full delta.
    #
    # API note: pyjevsim exports `StructuralModel` (coupled DEVS) and
    # `BehaviorModel` (atomic DEVS) — NOT the DEVS-canonical names
    # `CoupledModel` / `AtomicModel`. Method names also differ:
    # pyjevsim uses `output()` / `int_trans()` / `ext_trans()`. The
    # bridge's `CoupledModelProtocol` in
    # pysdk/pyjevsim_bridge/_protocol.py keeps the canonical names;
    # `examples/pyjevsim/_real_pyjevsim_adapter.py` maps the real
    # pyjevsim surface onto the Protocol.
    "pyjevsim==2.0.1",
]

[tool.setuptools.packages.find]
include = ["rti1516e*", "pyjevsim_bridge*"]
exclude = ["tests*", "**/_generated*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "spec: orchestrator-frozen specification tests (pysdk/tests/spec/m4/) — agents may add but never weaken",
    "slow: tests that take >1s",
    "integration: cross-process / cross-language integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
# Agent C's _generated/ is auto-generated and not strict-clean. Skip it.
exclude = [
    "rti1516e/_generated/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
]

[[tool.mypy.overrides]]
module = "rti1516e._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The gRPC stubs in _generated/ are namespaced as "rti.v1.*"; mypy can't
# find them because they live under rti1516e/_generated/ (the package
# is installed via a sys.path tweak by the test scaffold + the
# GrpcTransport's lazy imports). Treating the imports as Any keeps the
# cross-language-smoke wiring strict-clean without weakening the rest
# of the SDK.
module = "rti.v1.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# grpc has incomplete public type stubs; treat as Any rather than
# pulling types-grpcio (which lags upstream). The GrpcTransport only
# touches grpc.aio.insecure_channel + grpc.aio.AioRpcError shapes —
# small enough surface that runtime checking is sufficient.
module = "grpc"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyjevsim is an optional runtime dep; spec tests use a Protocol shim instead.
module = "pyjevsim.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The example-tree adapters under examples/pyjevsim/ are imported by
# pysdk-side tests via a sys.path tweak; mypy can't see them as a
# proper package. Treat as Any rather than failing the strict check.
module = ["_real_pyjevsim_adapter", "cross_lang_runner"]
ignore_missing_imports = true

[tool.ruff]
extend = "../ruff.toml"
extend-exclude = ["rti1516e/_generated"]

[tool.ruff.lint.per-file-ignores]
# Re-state the project-wide test-tree ignores (the local [tool.ruff.lint]
# table does NOT inherit per-file-ignores from the extended ruff.toml).
"**/tests/**" = ["S101", "S311", "SIM117"]
"**/_generated/**" = ["E", "F", "W", "B", "C4", "I", "N", "UP", "S", "RET", "SIM", "PIE", "ASYNC"]
# errors.py: exception classes are named after proto ErrorCode entries
# (e.g. ERR_FED_NOT_FOUND -> FederationNotFound) so the name-to-code
# mapping is direct. The base class is RtiError; subclasses intentionally
# omit the -Error suffix to mirror the proto naming.
"rti1516e/errors.py" = ["N818"]
# _grpc_errors.py: cut-3 typed exceptions (M12 W2) follow the same
# naming convention as errors.py — they live alongside the cut-1
# RtiError hierarchy and the unsuffixed names match the gRPC status
# semantics they represent (NotFound, AlreadyExists, etc.).
"rti1516e/_grpc_errors.py" = ["N818"]
