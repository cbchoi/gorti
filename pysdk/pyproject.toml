[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rti1516e"
version = "0.1.0"
description = "Python SDK for the gorti RTI (IEEE 1516-2010 / HLA Evolved) and pyjevsim bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "gorti contributors" }]

# Runtime dependencies. Keep tight — every dep is friction for users.
# - grpcio + protobuf: client transport + wire format (FROZEN — required to talk to rtid)
# - grpcio-tools is a build-time dep for `_proto.py`; pinned in the dev extra below
# - pyjevsim: bridge target. Version is set by TASK-072 (Agent C); leaving unpinned
#   here so the orchestrator pre-work doesn't pre-empt that task's decision.
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60",         # codegen for _generated/
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-protobuf>=4.24",
]
# pyjevsim extra is wired by TASK-072. Spec tests under pysdk/tests/spec/m4/
# avoid importing real pyjevsim — they consume the typing.Protocol shim in
# pysdk/pyjevsim_bridge/_protocol.py via the StubCoupledModel fake.
pyjevsim = [
    # TASK-072 (Agent C / W5B): pinned to 1.3.1 (latest on PyPI as of 2026-05).
    # Discovered via `pip index versions pyjevsim` — published versions on PyPI
    # are 1.0.0, 1.3.0, 1.3.1. Upstream: https://github.com/cbchoi/pyjevsim
    #
    # WARNING: pyjevsim 1.3.1 does NOT export `CoupledModel` / `AtomicModel`
    # (the symbols `pysdk/tests/spec/m4/test_spec_m4_pyjevsim_smoke.py`
    # asserts on). The actual pyjevsim API uses `StructuralModel` (coupled)
    # and `BehaviorModel` (atomic). No published pyjevsim version (1.0.0,
    # 1.3.0, 1.3.1) or upstream branch (main, develop) exports the legacy
    # `CoupledModel` / `AtomicModel` names. The smoke test consequently
    # FAILS instead of PASSING — see docs/tasks/signals/TASK-072.done for
    # the full investigation. Orchestrator must either (a) update the
    # spec test's required-symbols list to ["StructuralModel", "BehaviorModel"],
    # or (b) request upstream to add backward-compatible aliases.
    "pyjevsim==1.3.1",
]

[tool.setuptools.packages.find]
include = ["rti1516e*", "pyjevsim_bridge*"]
exclude = ["tests*", "**/_generated*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "spec: orchestrator-frozen specification tests (pysdk/tests/spec/m4/) — agents may add but never weaken",
    "slow: tests that take >1s",
    "integration: cross-process / cross-language integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
# Agent C's _generated/ is auto-generated and not strict-clean. Skip it.
exclude = [
    "rti1516e/_generated/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
]

[[tool.mypy.overrides]]
module = "rti1516e._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
# pyjevsim is an optional runtime dep; spec tests use a Protocol shim instead.
module = "pyjevsim.*"
ignore_missing_imports = true

[tool.ruff]
extend = "../ruff.toml"
extend-exclude = ["rti1516e/_generated"]

[tool.ruff.lint.per-file-ignores]
# Re-state the project-wide test-tree ignores (the local [tool.ruff.lint]
# table does NOT inherit per-file-ignores from the extended ruff.toml).
"**/tests/**" = ["S101", "S311", "SIM117"]
"**/_generated/**" = ["E", "F", "W", "B", "C4", "I", "N", "UP", "S", "RET", "SIM", "PIE", "ASYNC"]
# errors.py: exception classes are named after proto ErrorCode entries
# (e.g. ERR_FED_NOT_FOUND -> FederationNotFound) so the name-to-code
# mapping is direct. The base class is RtiError; subclasses intentionally
# omit the -Error suffix to mirror the proto naming.
"rti1516e/errors.py" = ["N818"]
