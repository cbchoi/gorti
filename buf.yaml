version: v2
modules:
  - path: proto
breaking:
  use:
    - PACKAGE
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    # The v1 wire contract predates Buf's standard RPC/enum naming rules.
    # Renaming these symbols would break existing SDKs and federates.
    - ENUM_VALUE_PREFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
