[pytest]
# Each example test (under examples/pyjevsim*/test_*.py) loads its
# own runner.py via importlib.util.spec_from_file_location under a
# UNIQUE module name (e.g. `_pyjevsim_relay_runner`). Without this,
# cross-collection (`pytest examples/`) collides on the bare
# `runner` module-name in sys.modules. The pattern is documented
# inline in each test file.
#
# pytest itself doesn't need import_mode tuning here — the
# importlib-per-test pattern is doing the work.
asyncio_mode = auto

# The IVCT-derived conformance subset uses tc_*.py names. Preserve the default
# test_*.py pattern while collecting those scenarios as well.
python_files = test_*.py tc_*.py

# Register the conformance marks so strict warning configurations stay clean.
markers =
    conformance: IEEE 1516.1-2010 conformance test.
    integration: Test that starts or connects to real gorti processes.
    ivct_subset: gorti's Python IVCT-derived conformance subset.
