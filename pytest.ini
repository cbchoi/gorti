[pytest]
# Use the importlib import mode so multiple example directories with
# same-named modules (e.g. each `examples/pyjevsim*/runner.py`) don't
# collide in pytest's module cache when collected together.
#
# Default mode 'prepend' inserts each test's parent dir into sys.path
# and reuses the module under its bare name in sys.modules — so the
# first `runner.py` loaded shadows every later one. With importlib
# mode pytest constructs each test as its own importlib spec under a
# unique fully-qualified name, so cross-example collection works.
#
# Per-example invocation (`pytest examples/pyjevsim-relay/`) works in
# either mode; this config only matters for `pytest examples/`.
import_mode = importlib
asyncio_mode = auto
