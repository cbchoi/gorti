name: Feature request
description: Propose a scoped capability or standards improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What federation or development need is not currently met?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the affected HLA service, API, and expected semantics.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: verification
    attributes:
      label: Verification approach
      description: Explain how interoperability and deterministic behavior can be tested.
