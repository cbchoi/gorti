# Manually requested internal service validation for the supported SDKs.
name: Conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Go, Python, Java and internal IVCT-derived checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GORTI_VALIDATION_ARTIFACTS: ${{ runner.temp }}/sdk-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: bufbuild/buf-setup-action@v1
      - name: Python validation dependencies
        run: python -m pip install -e './pysdk[dev]' -r scripts/validation-requirements.txt
      - name: Supported SDK gates
        run: bash scripts/ci-gates.sh
      - name: Validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-validation
          path: ${{ runner.temp }}/sdk-validation
          if-no-files-found: ignore
