# DLC conformance gate — the M31-M37 compliance program's CI lane.
#
# Runs the full gate sequence from scripts/ci-gates.sh:
#   stubs → go → cpp → lockfile → static → sweep → ivct
#
# The sweep re-runs every conformance fixture against a fresh rtid and
# compares verdicts to cppsdk/tests/dlc/conformance/EXPECTED_VERDICTS.txt
# in both directions (regression AND unrecorded improvement fail).
#
# The Pitch parity lane (capturing goldens from a live pRTI) remains
# local-only, gated on PRTI_HOME — Pitch cannot be redistributed to CI.
# CI verifies gorti against the *committed* goldens.
#
# First run builds gRPC/protobuf via conan (~40-60 min); later runs hit
# the conan cache (~10-15 min total).

name: Conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: DLC gates (stubs → go → cpp → lockfile → static → sweep → ivct)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: bufbuild/buf-setup-action@v1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-gcc-${{ hashFiles('cppsdk/conanfile.txt') }}
          restore-keys: conan2-${{ runner.os }}-gcc-

      - name: conan install (grpc + protobuf + gtest)
        run: |
          pip install "conan>=2.4"
          conan profile detect --force
          conan install cppsdk \
            --output-folder=cppsdk/build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=17

      # ivct stage deps — pysdk drives a live rtid over gRPC; the stubs
      # stage already generated pysdk/rti1516e/_generated from proto/.
      # Pins are loose on purpose: the generated stubs track whatever
      # protobuf/grpcio the runner resolves.
      - name: python deps for ivct subset (grpcio protobuf pytest)
        run: |
          pip install "grpcio>=1.60" "protobuf>=4.25" \
                      "pytest>=8" "pytest-asyncio>=0.23"

      - name: gates
        run: |
          chmod +x scripts/ci-gates.sh
          scripts/ci-gates.sh stubs go cpp lockfile static sweep ivct

      - name: upload sweep logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-sweep-logs
          path: /tmp/ci-sweep-*.log
          if-no-files-found: ignore
