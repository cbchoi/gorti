name: Manual validation

on: workflow_dispatch

permissions:
  contents: read

jobs:
  go:
    name: Go (lint + test + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # rti/internal/genproto is gitignored — generate before any Go step
      # or nothing under ./rti compiles.
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        run: buf generate

      - name: generated Go bindings are current
        run: git diff --exit-code -- rti/internal/genproto

      - name: gofmt check
        run: make go-fmt-check

      - name: example entrypoints
        run: make examples-check

      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61.0

      - name: golangci-lint
        run: make go-lint

      - name: go test
        run: make go-test-coverage

      - name: coverage report
        run: make go-coverage-report

      - name: determinism harness
        run: make determinism

  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: bufbuild/buf-setup-action@v1
      - name: generate protocol bindings
        run: buf generate
      - name: install
        working-directory: pysdk
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: ruff
        run: ruff check pysdk/
      - name: release metadata
        run: python scripts/check_release_metadata.py
      - name: mypy
        working-directory: pysdk
        run: mypy --strict rti1516e pyjevsim_bridge
      - name: pytest
        working-directory: pysdk
        run: pytest --maxfail=1
      - name: DEVStone-HLA benchmark contract
        run: |
          python -m unittest discover -s benchmark/common/tests -v
          python -m unittest discover -s benchmark/devstone/workload/tests -v
          python -m unittest discover -s benchmark/portico-gorti/tests -v
          python -m pytest verification/portico/tests -q

  proto:
    name: Proto lint + breaking check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
      - name: buf breaking
        run: buf breaking --against ".git#branch=main"
