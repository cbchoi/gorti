name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (lint + test + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # rti/internal/genproto is gitignored — generate before any Go step
      # or nothing under ./rti compiles.
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        run: buf generate

      - name: gofmt check
        run: make go-fmt-check

      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61.0

      - name: golangci-lint
        run: make go-lint

      - name: go test
        run: make go-test-coverage

      - name: coverage report
        run: make go-coverage-report

      - name: determinism harness
        run: make determinism

  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    if: hashFiles('pysdk/pyproject.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: bufbuild/buf-setup-action@v1
      - name: generate protocol bindings
        run: buf generate
      - name: install
        working-directory: pysdk
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: ruff
        run: ruff check pysdk/
      - name: release metadata
        run: python scripts/check_release_metadata.py
      - name: mypy
        working-directory: pysdk
        run: mypy --strict .
      - name: pytest
        working-directory: pysdk
        run: pytest --maxfail=1

  proto:
    name: Proto lint + breaking check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
      - name: buf breaking
        run: buf breaking --against ".git#branch=main"

  frozen-paths:
    name: Frozen-paths check (agent branches only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: |
          chmod +x scripts/check-frozen-paths.sh
          # On PRs from agent/* branches, run the hook against the diff vs base.
          if [[ "${GITHUB_REF##*/}" =~ ^(agent/[abc]/) ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed.txt || true
            cat /tmp/changed.txt
            # The shell hook reads from `git diff --cached`; for CI we adapt.
            ./scripts/check-frozen-paths.sh
          else
            echo "not an agent branch; skipping"
          fi
