name: Manual validation

on: workflow_dispatch

permissions:
  contents: read

jobs:
  go:
    name: Go (lint + test + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # Buf generates Go/Python; the Java job uses Maven's protobuf plugin.
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        run: buf generate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python peer for Go interoperability tests
        run: python -m pip install -e './pysdk[dev]'

      - name: generated Go bindings are current
        run: git diff --exit-code -- rti/internal/adapters/protobuf

      - name: gofmt check
        run: make go-fmt-check

      - name: example entrypoints
        run: make examples-check

      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61.0

      - name: golangci-lint
        run: make go-lint

      - name: go test
        run: make go-test-coverage

      - name: coverage report
        run: make go-coverage-report

      - name: determinism harness
        run: make determinism

  python:
    name: Python (ruff + mypy + HLA SDK tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: bufbuild/buf-setup-action@v1
      - name: generate protocol bindings
        run: buf generate
      - name: install
        working-directory: pysdk
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: ruff
        run: ruff check pysdk/
      - name: release metadata
        run: python scripts/check_release_metadata.py
      - name: mypy
        working-directory: pysdk
        run: mypy --strict rti1516e pyjevsim_bridge
      - name: Python SDK and live services
        run: python scripts/validate_sdks.py python --artifacts "${RUNNER_TEMP}/sdk-validation/python"
      - name: DEVStone-HLA benchmark contract
        run: |
          python -m unittest discover -s benchmark/common/tests -v
          python -m unittest discover -s benchmark/devstone/workload/tests -v
          python -m unittest discover -s benchmark/portico-gorti/tests -v
          python -m pytest verification/portico/tests -q

      - name: Validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-validation
          path: ${{ runner.temp }}/sdk-validation/python
          if-no-files-found: ignore

  java:
    name: Java (generated API + live SDK tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: bufbuild/buf-setup-action@v1
      - name: Python peer for Java interoperability tests
        run: |
          buf generate
          python -m pip install -e './pysdk[dev]'
      - name: Java SDK and live services
        run: python scripts/validate_sdks.py java --artifacts "${RUNNER_TEMP}/sdk-validation/java"
      - name: Validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-validation
          path: ${{ runner.temp }}/sdk-validation/java
          if-no-files-found: ignore

  configuration:
    name: Supported-language validation configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/validation-requirements.txt
      - run: python -m unittest discover -s scripts/tests -p 'test_validation_*.py' -v
      - run: python scripts/check_release_metadata.py
      - run: bash -n scripts/ci-gates.sh

  proto:
    name: Proto lint + breaking check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
      - name: buf breaking
        run: buf breaking --against ".git#branch=main"
