name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (lint + test + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt check
        run: |
          OUT=$(gofmt -l -s .)
          if [[ -n "$OUT" ]]; then
            echo "::error ::files need gofmt:"
            echo "$OUT"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --config .golangci.yml ./...

      - name: go test
        run: go test -race -timeout 60s -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage report
        run: go tool cover -func=coverage.out

      - name: determinism harness
        run: go test -tags=determinism -count=10 -race -run=Determinism ./... || echo "no determinism tests yet (M0)"

  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    if: hashFiles('pysdk/pyproject.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        working-directory: pysdk
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install ruff mypy pytest pytest-asyncio
      - name: ruff
        run: ruff check pysdk/
      - name: mypy
        working-directory: pysdk
        run: mypy --strict . || true   # M0: no Python code yet
      - name: pytest
        working-directory: pysdk
        run: pytest --maxfail=1 || true # M0: no tests yet

  proto:
    name: Proto lint + breaking check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
      - name: buf breaking
        run: buf breaking --against ".git#branch=main" || echo "no main yet (M0)"

  frozen-paths:
    name: Frozen-paths check (agent branches only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: |
          chmod +x scripts/check-frozen-paths.sh
          # On PRs from agent/* branches, run the hook against the diff vs base.
          if [[ "${GITHUB_REF##*/}" =~ ^(agent/[abc]/) ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed.txt || true
            cat /tmp/changed.txt
            # The shell hook reads from `git diff --cached`; for CI we adapt.
            ./scripts/check-frozen-paths.sh
          else
            echo "not an agent branch; skipping"
          fi
