syntax = "proto3";

package rti.v1;

import "rti/v1/common.proto";

option go_package = "github.com/cbchoi/gorti/rti/internal/genproto/rti/v1;rtiv1";

// SavepointService — Federation save/restore per IEEE 1516.1-2010 §4.8-4.12.
// Cut-3 (M12) gRPC exposure of cut-2 savepoint.Manager.
service SavepointService {
  rpc RequestFederationSave(RequestFederationSaveRequest) returns (Empty);
  rpc FederateSaveComplete(FederateSaveResponseRequest) returns (Empty);
  rpc FederateSaveNotComplete(FederateSaveResponseRequest) returns (Empty);
  rpc QuerySaveState(QuerySaveStateRequest) returns (QuerySaveStateResponse);
  rpc RequestFederationRestore(RequestFederationRestoreRequest) returns (Empty);
  rpc FederateRestoreComplete(FederateRestoreResponseRequest) returns (Empty);
  rpc QueryRestoreState(QueryRestoreStateRequest) returns (QueryRestoreStateResponse);

  // M24 W3 — IEEE 1516.1-2010 §4.28 + §4.30.
  rpc AbortFederationSave(AbortFederationSaveRequest) returns (Empty);
  rpc AbortFederationRestore(AbortFederationRestoreRequest) returns (Empty);

  // IEEE 1516.1-2010 4.18 and 4.28; independent participant transitions.
  rpc FederateSaveBegun(FederateSaveResponseRequest) returns (Empty);
  rpc FederateRestoreNotComplete(FederateRestoreResponseRequest) returns (Empty);
}

// AbortFederationSave — §4.28 (M24).
message AbortFederationSaveRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  optional uint64 federate_handle = 3;
}

// AbortFederationRestore — §4.30 (M24).
message AbortFederationRestoreRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  optional uint64 federate_handle = 3;
}

message RequestFederationSaveRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;  // requester
  string label = 4;
  // Optional save-time pin; absent means "save now at current sync point".
  optional double save_time = 5;
  LogicalTimeValue save_time_value = 6;
}

message FederateSaveResponseRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  // Private SDK runtime checkpoint, accepted only by FederateSaveComplete.
  // Not application-model state; bounded to 1 MiB and returned only to its participant.
  bytes client_state = 4;
}

enum SaveState {
  SAVE_STATE_UNSPECIFIED = 0;
  SAVE_STATE_IDLE = 1;
  SAVE_STATE_INITIATED = 2;
  SAVE_STATE_SAVED = 3;
  SAVE_STATE_NOT_SAVED = 4;
}

message QuerySaveStateRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  string label = 3;
}

message QuerySaveStateResponse {
  SaveState state = 1;
  // Current federation-wide vector, independent of the requested legacy label.
  repeated FederateSaveStatus federate_statuses = 2;
  string active_label = 3;
}

message RequestFederationRestoreRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;  // requester
  string label = 4;
  // Select an exact saved execution. Omission restores within this execution.
  optional uint64 saved_federation_generation = 5;
}

message FederateRestoreResponseRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
}

enum RestoreState {
  RESTORE_STATE_UNSPECIFIED = 0;
  RESTORE_STATE_IDLE = 1;
  RESTORE_STATE_LOADING = 2;
  RESTORE_STATE_INITIATED = 3;
  RESTORE_STATE_COMPLETED = 4;
  RESTORE_STATE_FAILED = 5;
}

message QueryRestoreStateRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  string label = 3;
}

message QueryRestoreStateResponse {
  RestoreState state = 1;
  repeated FederateRestoreStatus federate_statuses = 2;
  string active_label = 3;
}

enum FederateSaveProgress {
  FEDERATE_SAVE_PROGRESS_UNSPECIFIED = 0;
  FEDERATE_SAVE_PROGRESS_NO_SAVE_IN_PROGRESS = 1;
  FEDERATE_SAVE_PROGRESS_INSTRUCTED_TO_SAVE = 2;
  FEDERATE_SAVE_PROGRESS_SAVING = 3;
  FEDERATE_SAVE_PROGRESS_WAITING_FOR_FEDERATION_TO_SAVE = 4;
}

message FederateSaveStatus {
  uint64 federate_handle = 1;
  FederateSaveProgress status = 2;
}

enum FederateRestoreProgress {
  FEDERATE_RESTORE_PROGRESS_UNSPECIFIED = 0;
  FEDERATE_RESTORE_PROGRESS_NO_RESTORE_IN_PROGRESS = 1;
  FEDERATE_RESTORE_PROGRESS_RESTORE_REQUEST_PENDING = 2;
  FEDERATE_RESTORE_PROGRESS_WAITING_FOR_RESTORE_TO_BEGIN = 3;
  FEDERATE_RESTORE_PROGRESS_PREPARED_TO_RESTORE = 4;
  FEDERATE_RESTORE_PROGRESS_RESTORING = 5;
  FEDERATE_RESTORE_PROGRESS_WAITING_FOR_FEDERATION_TO_RESTORE = 6;
}

message FederateRestoreStatus {
  uint64 pre_restore_handle = 1;
  // Zero means no post-restore identity has been assigned yet.
  uint64 post_restore_handle = 2;
  FederateRestoreProgress status = 3;
}
