syntax = "proto3";

package rti.v1;

import "rti/v1/common.proto";

option go_package = "github.com/cbchoi/gorti/rti/internal/genproto/rti/v1;rtiv1";

// ObjectService — object/interaction operations.
// See docs/srs.md §5.3.
service ObjectService {
  rpc RegisterObjectInstance(RegisterObjectRequest) returns (RegisterObjectResponse);
  rpc UpdateAttributeValues(UpdateAttributeValuesRequest) returns (Empty);
  rpc SendInteraction(SendInteractionRequest) returns (Empty);

  // M23 — IEEE 1516.1-2010 §6 additions (append-only).
  rpc DeleteObjectInstance(DeleteObjectInstanceRequest) returns (Empty);
  rpc LocalDeleteObjectInstance(LocalDeleteObjectInstanceRequest) returns (Empty);
  rpc RequestAttributeValueUpdate(RequestAttributeValueUpdateRequest) returns (Empty);
  rpc RequestClassAttributeValueUpdate(RequestClassAttributeValueUpdateRequest) returns (Empty);
}

message RegisterObjectRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint64 object_class_handle = 4;
  // Optional name; if empty, RTI generates one.
  string object_name = 5;
}

message RegisterObjectResponse {
  uint64 object_handle = 1;
  // Name actually assigned (echoed if client supplied).
  string object_name = 2;
}

message UpdateAttributeValuesRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint64 object_handle = 4;
  // attribute_handle -> HLA-encoded bytes (per IEEE 1516.2-2010 §4 encoding rules).
  map<uint64, bytes> attributes = 5;
  // Optional. If absent, message is RO; if present, TSO with this timestamp.
  optional double logical_time = 6;
}

message SendInteractionRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint64 interaction_class_handle = 4;
  // parameter_handle -> HLA-encoded bytes.
  map<uint64, bytes> parameters = 5;
  // Optional. If absent, RO; if present, TSO with this timestamp.
  optional double logical_time = 6;
}

// DeleteObjectInstance — IEEE 1516.1-2010 §6.16 (M23).
// Owner-only: returns PermissionDenied + object_not_owned if the
// caller doesn't own all attributes of obj. Removes the instance
// from the federation; emits RemoveObjectInstance to subscribers
// via the existing FederateEvent.remove oneof tag.
message DeleteObjectInstanceRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint64 object_handle = 4;
  // Optional TSO timestamp; absent → RO delete.
  optional double logical_time = 5;
  // User-supplied tag passed through to RemoveObjectInstance.tag.
  bytes user_supplied_tag = 6;
}

// LocalDeleteObjectInstance — IEEE 1516.1-2010 §6.18 (M23).
// Federate-local cleanup; no peer notification. M23 records the
// event but cut-1 simplification keeps the global instance live
// for other subscribers — the requester is expected to drop their
// own local view.
message LocalDeleteObjectInstanceRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint64 object_handle = 4;
}

// RequestAttributeValueUpdate — IEEE 1516.1-2010 §6.24 (M23).
// Subscriber asks the owner of obj to emit fresh values. Manager
// resolves owner and emits ProvideAttributeValueUpdate event.
message RequestAttributeValueUpdateRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint64 object_handle = 4;
  repeated uint64 attribute_handles = 5;
  bytes user_supplied_tag = 6;
}

// RequestClassAttributeValueUpdate — IEEE 1516.1-2010 §6.25 (M23).
// Class-scoped variant — every owner of any instance of the class
// receives a ProvideAttributeValueUpdate event.
message RequestClassAttributeValueUpdateRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint64 object_class_handle = 4;
  repeated uint64 attribute_handles = 5;
  bytes user_supplied_tag = 6;
}
