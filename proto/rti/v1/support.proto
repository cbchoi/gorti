syntax = "proto3";

package rti.v1;

import "rti/v1/common.proto";

option go_package = "github.com/cbchoi/gorti/rti/internal/genproto/rti/v1;rtiv1";

// SupportService — IEEE 1516.1-2010 §10 handle / name / type lookup
// services. M25 Phase B. These are pure functions of the federation's
// FOM; no federate-side state is mutated. All methods are scoped by
// federation_name so a single rtid serving multiple federations can
// answer for each independently.
service SupportService {
  rpc ReportCallbackInvocation(ReportCallbackInvocationRequest) returns (Empty);
  rpc NormalizeFederateHandle(NormalizeFederateHandleRequest) returns (NormalizeFederateHandleResponse);
  rpc NormalizeServiceGroup(NormalizeServiceGroupRequest) returns (NormalizeServiceGroupResponse);
  rpc GetUpdateRateValue(GetUpdateRateValueRequest) returns (GetUpdateRateValueResponse);
  rpc GetUpdateRateValueForAttribute(GetUpdateRateValueForAttributeRequest) returns (GetUpdateRateValueForAttributeResponse);
  rpc GetAvailableDimensionsForClassAttribute(GetAvailableDimensionsForClassAttributeRequest) returns (GetAvailableDimensionsForClassAttributeResponse);
  rpc GetAvailableDimensionsForInteractionClass(GetAvailableDimensionsForInteractionClassRequest) returns (GetAvailableDimensionsForInteractionClassResponse);
  rpc GetDimensionHandleSet(GetDimensionHandleSetRequest) returns (GetDimensionHandleSetResponse);
  // §10.2 handle ↔ name
  rpc GetObjectClassHandle(GetObjectClassHandleRequest) returns (GetObjectClassHandleResponse);
  rpc GetObjectClassName(GetObjectClassNameRequest) returns (GetObjectClassNameResponse);
  rpc GetAttributeHandle(GetAttributeHandleRequest) returns (GetAttributeHandleResponse);
  rpc GetAttributeName(GetAttributeNameRequest) returns (GetAttributeNameResponse);
  rpc GetInteractionClassHandle(GetInteractionClassHandleRequest) returns (GetInteractionClassHandleResponse);
  rpc GetInteractionClassName(GetInteractionClassNameRequest) returns (GetInteractionClassNameResponse);
  rpc GetParameterHandle(GetParameterHandleRequest) returns (GetParameterHandleResponse);
  rpc GetParameterName(GetParameterNameRequest) returns (GetParameterNameResponse);

  // §10.2 dimension services
  rpc GetDimensionHandle(GetDimensionHandleRequest) returns (GetDimensionHandleResponse);
  rpc GetDimensionName(GetDimensionNameRequest) returns (GetDimensionNameResponse);
  rpc GetDimensionUpperBound(GetDimensionUpperBoundRequest) returns (GetDimensionUpperBoundResponse);

  // §10.2 order / transportation services. order_name and
  // transportation_name are FOM strings ("Receive"/"TimeStamp" /
  // "HLAreliable"/"HLAbestEffort"); the type fields encode the
  // standard MIM enum values (1=HLAreliable, 2=HLAbestEffort;
  // 1=Receive, 2=TimeStamp) per §10.2.
  rpc GetOrderType(GetOrderTypeRequest) returns (GetOrderTypeResponse);
  rpc GetOrderName(GetOrderNameRequest) returns (GetOrderNameResponse);
  rpc GetTransportationType(GetTransportationTypeRequest) returns (GetTransportationTypeResponse);
  rpc GetTransportationName(GetTransportationNameRequest) returns (GetTransportationNameResponse);

  // §6.30 / §6.31 runtime object-instance handle services (M27 Phase C).
  // Unlike the FOM-driven lookups above, these queries hit the runtime
  // object registry — a federate that joins after another federate
  // registered "car-7" can call GetObjectInstanceHandle("car-7") to
  // recover the handle without having received the Discover callback.
  rpc GetObjectInstanceHandle(GetObjectInstanceHandleRequest) returns (GetObjectInstanceHandleResponse);
  rpc GetObjectInstanceName(GetObjectInstanceNameRequest) returns (GetObjectInstanceNameResponse);
  rpc GetKnownObjectClassHandle(GetKnownObjectClassHandleRequest) returns (GetKnownObjectClassHandleResponse);
}

message ReportCallbackInvocationRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  reserved 4;
  bytes callback_receipt = 5;
  bool success = 6;
  string exception = 7;
  // False/absent retains completion reporting; entry precedes user invocation.
  bool invocation_entry = 8;
}

message NormalizeFederateHandleRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint64 target_handle = 4;
}

message NormalizeFederateHandleResponse { uint64 value = 1; }

message NormalizeServiceGroupRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 federate_handle = 3;
  uint32 service_group = 4;
}

message NormalizeServiceGroupResponse { uint64 value = 1; }

message GetObjectClassHandleRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  string class_name = 3;
}
message GetObjectClassHandleResponse {
  uint64 class_handle = 1;
}

message GetObjectClassNameRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 class_handle = 3;
}
message GetObjectClassNameResponse {
  string class_name = 1;
}

message GetAttributeHandleRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 class_handle = 3;
  string attribute_name = 4;
}
message GetAttributeHandleResponse {
  uint64 attribute_handle = 1;
}

message GetAttributeNameRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 class_handle = 3;
  uint64 attribute_handle = 4;
}
message GetAttributeNameResponse {
  string attribute_name = 1;
}

message GetInteractionClassHandleRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  string class_name = 3;
}
message GetInteractionClassHandleResponse {
  uint64 class_handle = 1;
}

message GetInteractionClassNameRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 class_handle = 3;
}
message GetInteractionClassNameResponse {
  string class_name = 1;
}

message GetParameterHandleRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 class_handle = 3;
  string parameter_name = 4;
}
message GetParameterHandleResponse {
  uint64 parameter_handle = 1;
}

message GetParameterNameRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 class_handle = 3;
  uint64 parameter_handle = 4;
}
message GetParameterNameResponse {
  string parameter_name = 1;
}

message GetDimensionHandleRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  string dimension_name = 3;
}
message GetDimensionHandleResponse {
  uint64 dimension_handle = 1;
}

message GetDimensionNameRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 dimension_handle = 3;
}
message GetDimensionNameResponse {
  string dimension_name = 1;
}

message GetDimensionUpperBoundRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 dimension_handle = 3;
}
message GetDimensionUpperBoundResponse {
  uint64 upper_bound = 1;
}

message GetOrderTypeRequest {
  WireVersion wire_version = 1;
  string order_name = 2;
}
message GetOrderTypeResponse {
  uint32 order_type = 1;  // 1=Receive, 2=TimeStamp
}

message GetOrderNameRequest {
  WireVersion wire_version = 1;
  uint32 order_type = 2;
}
message GetOrderNameResponse {
  string order_name = 1;
}

message GetTransportationTypeRequest {
  WireVersion wire_version = 1;
  string transportation_name = 2;
}
message GetTransportationTypeResponse {
  uint32 transportation_type = 1;  // 1=HLAreliable, 2=HLAbestEffort
}

message GetTransportationNameRequest {
  WireVersion wire_version = 1;
  uint32 transportation_type = 2;
}
message GetTransportationNameResponse {
  string transportation_name = 1;
}

// §6.30 — resolve an object instance name to its runtime handle.
message GetObjectInstanceHandleRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  string object_name = 3;
  uint64 federate_handle = 4; // Nonzero selects caller-scoped object knowledge.
}
message GetObjectInstanceHandleResponse {
  uint64 object_handle = 1;
}

// §6.31 — resolve an object instance handle to its registered name.
message GetObjectInstanceNameRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 object_handle = 3;
  uint64 federate_handle = 4; // Zero retains the legacy administrative lookup.
}
message GetObjectInstanceNameResponse {
  string object_name = 1;
}

message GetKnownObjectClassHandleRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 object_handle = 3;
  uint64 federate_handle = 4;
}

message GetKnownObjectClassHandleResponse {
  uint64 class_handle = 1;
}

message GetUpdateRateValueRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  string update_rate_designator = 3;
  uint64 federate_handle = 4;
}
message GetUpdateRateValueResponse {
  double update_rate = 1;
}

message GetUpdateRateValueForAttributeRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 object_handle = 3;
  uint64 attribute_handle = 4;
  uint64 federate_handle = 5;
}
message GetUpdateRateValueForAttributeResponse {
  double update_rate = 1;
}

message GetAvailableDimensionsForClassAttributeRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 object_class_handle = 3;
  uint64 attribute_handle = 4;
  uint64 federate_handle = 5;
}
message GetAvailableDimensionsForClassAttributeResponse {
  repeated uint64 dimension_handles = 1;
}

message GetAvailableDimensionsForInteractionClassRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 interaction_class_handle = 3;
  uint64 federate_handle = 4;
}
message GetAvailableDimensionsForInteractionClassResponse {
  repeated uint64 dimension_handles = 1;
}

message GetDimensionHandleSetRequest {
  WireVersion wire_version = 1;
  string federation_name = 2;
  uint64 region_handle = 3;
  uint64 federate_handle = 4;
}
message GetDimensionHandleSetResponse {
  repeated uint64 dimension_handles = 1;
}
