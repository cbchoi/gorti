run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocyclo
    - gosec
    - misspell
    - goconst
    - unused
    - gocritic
    - forbidigo
    - depguard
    - ineffassign

linters-settings:
  gocyclo:
    min-complexity: 15
  forbidigo:
    forbid:
      - p: '^time\.Now$'
        msg: "use core.Clock for determinism (see CODING_CONVENTIONS.md D-1)"
      - p: '^time\.Since$'
        msg: "use core.Clock for determinism"
      - p: '^fmt\.Print(ln|f)?$'
        msg: "use log/slog for committed code"
  depguard:
    rules:
      standalone-packages:
        list-mode: lax
        files:
          - "**/rti/pkg/**"
          - "!**/rti/pkg/federate/**"
          - "!$test"
        deny:
          - pkg: "github.com/cbchoi/gorti/rti/internal"
            desc: "standalone SDK libraries must not depend on server internals"
      federate-client-boundary:
        list-mode: lax
        files:
          - "**/rti/pkg/federate/**"
          - "!$test"
        allow:
          - "github.com/cbchoi/gorti/rti/internal/adapters/protobuf"
          - "github.com/cbchoi/gorti/rti/internal/adapters/delivery/callbackprofile$"
        deny:
          - pkg: "github.com/cbchoi/gorti/rti/internal"
            desc: "the client may use protocol codecs and receipt profiles, not server services"

issues:
  # The repository predates the current lint profile. Keep that debt visible
  # locally while rejecting newly introduced violations on branch changes.
  new-from-rev: origin/main
  exclude-rules:
    - path: _test\.go
      linters: [gosec, gocyclo]
    - path: rti/internal/adapters/protobuf/rti/v1/.*\.pb\.go$
      linters: [revive, gocyclo, errcheck, staticcheck]
    - path: tests/spec/
      linters: [gocyclo]
    # rti/internal/hla/core/clock.go is the single sanctioned wrapper around
    # time.Now (the whole reason core.Clock exists). Everywhere else,
    # forbidigo's time.Now ban applies — see CODING_CONVENTIONS.md D-1.
    - path: rti/internal/hla/core/clock\.go
      linters: [forbidigo]
